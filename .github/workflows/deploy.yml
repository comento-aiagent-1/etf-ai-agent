name: Build, test and publish image

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set image reference
        shell: bash
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build Linux amd64 image
        shell: bash
        run: |
          docker build --platform linux/amd64 \
            --file infra/Dockerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE" .

      - name: Test image without external API access
        shell: bash
        run: |
          docker run --rm --network none \
            -e OPENAI_API_KEY=ci-placeholder-not-a-real-key \
            -e FAQ_RUN_LIVE_TESTS=0 \
            "$IMAGE" python -m unittest discover -s tests -v
          docker run --rm --network none "$IMAGE" python -c \
            "import os; from pathlib import Path; assert os.getuid() != 0; assert not Path('/app/.env').exists(); assert not Path('/app/.streamlit/secrets.toml').exists(); assert Path('/app/data/source/FAQ.csv').is_file()"

      - name: Publish tested image to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          {
            echo '### Published image'
            echo 'Copy this value into the Azure VM .env file:'
            echo '```dotenv'
            echo "APP_IMAGE=$IMAGE"
            echo '```'
            echo 'Image publication only; Azure SSH deployment is not configured yet.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GHCR
        if: always() && github.event_name != 'pull_request'
        run: docker logout ghcr.io
